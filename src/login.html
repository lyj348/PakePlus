<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧党建综合智能管理平台 - 登录</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: #333;
    }

    .login-page {
      display: flex;
      min-height: 100vh;
    }

    /* ===== 左侧品牌区 ===== */
    .login-brand {
      flex: 1;
      min-width: 0;
      background: linear-gradient(145deg, #1a1520 0%, #2a1a1f 40%, #1e2433 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 80px;
      overflow: hidden;
    }

    .login-brand::before {
      content: '';
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(211, 47, 47, 0.18) 0%, transparent 70%);
      top: -120px;
      left: -80px;
      pointer-events: none;
    }

    .login-brand::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(211, 47, 47, 0.12) 0%, transparent 70%);
      bottom: -100px;
      right: 10%;
      pointer-events: none;
    }

    .brand-content {
      position: relative;
      z-index: 1;
      max-width: 720px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.7s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-title {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      line-height: 1.45;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .brand-title em {
      font-style: normal;
      color: #ff8a80;
    }

    .brand-desc {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.7;
      margin-bottom: 48px;
    }

    .brand-illustration {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      animation: floatY 4s ease-in-out infinite;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .brand-illustration svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ===== 右侧登录区 ===== */
    .login-panel {
      width: 420px;
      flex-shrink: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 48px 32px;
      position: relative;
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.12);
      animation: slideInRight 0.55s ease-out;
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .login-panel-inner {
      width: 100%;
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: #303133;
      margin-bottom: 28px;
    }

    /* 登录方式切换 */
    .login-tabs {
      display: flex;
      gap: 28px;
      margin-bottom: 28px;
      border-bottom: 1px solid #ebeef5;
    }

    .login-tab {
      background: none;
      border: none;
      padding: 0 0 12px;
      font-size: 15px;
      color: #909399;
      cursor: pointer;
      position: relative;
      font-family: inherit;
      transition: color 0.25s;
    }

    .login-tab:hover {
      color: #d32f2f;
    }

    .login-tab.active {
      color: #d32f2f;
      font-weight: 600;
    }

    .login-tab.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: #d32f2f;
      border-radius: 1px;
    }

    .error-message {
      background: #fef0f0;
      color: #f56c6c;
      padding: 10px 12px;
      border-radius: 4px;
      margin-bottom: 18px;
      font-size: 13px;
      display: none;
      border: 1px solid #fde2e2;
    }

    .error-message.show {
      display: block;
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #606266;
    }

    .form-group label .required {
      color: #f56c6c;
      margin-right: 2px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 12px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 14px;
      color: #303133;
      background: #fff;
      transition: border-color 0.25s, box-shadow 0.25s;
      font-family: inherit;
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: #c0c4cc;
    }

    .input-wrapper input:focus {
      border-color: #d32f2f;
      box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.12);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #c0c4cc;
      cursor: pointer;
      font-size: 16px;
      background: none;
      border: none;
      padding: 4px;
      line-height: 1;
    }

    .toggle-password:hover {
      color: #909399;
    }

    .captcha-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .captcha-row .input-wrapper {
      flex: 1;
    }

    .captcha-img {
      width: 110px;
      height: 42px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      cursor: pointer;
      background: linear-gradient(135deg, #fafafa 0%, #f0f0f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #d32f2f;
      user-select: none;
      flex-shrink: 0;
      transition: border-color 0.25s;
    }

    .captcha-img:hover {
      border-color: #d32f2f;
    }

    .remember-row {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #606266;
      user-select: none;
    }

    .remember-me input {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid #dcdfe6;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      background: #fff;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .remember-me input:checked {
      background: #d32f2f;
      border-color: #d32f2f;
    }

    .remember-me input:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .login-btn {
      width: 100%;
      height: 44px;
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s, box-shadow 0.25s;
      font-family: inherit;
      letter-spacing: 1px;
    }

    .login-btn:hover {
      background: #b71c1c;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.35);
    }

    .login-btn:active {
      background: #9a0007;
    }

    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #909399;
      text-decoration: none;
      transition: color 0.25s;
    }

    .forgot-link:hover {
      color: #d32f2f;
    }

    .panel-footer {
      position: absolute;
      bottom: 20px;
      left: 48px;
      right: 48px;
      text-align: center;
      font-size: 11px;
      color: #c0c4cc;
      line-height: 1.6;
    }

    .panel-footer a {
      color: #c0c4cc;
      text-decoration: none;
    }

    .panel-footer a:hover {
      color: #909399;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 960px) {
      .login-brand {
        padding: 40px 40px;
      }

      .brand-title {
        font-size: 28px;
      }

      .login-panel {
        width: 380px;
        padding: 40px 36px 28px;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow: auto;
      }

      .login-page {
        flex-direction: column;
      }

      .login-brand {
        min-height: 280px;
        padding: 40px 24px 32px;
      }

      .brand-title {
        font-size: 22px;
      }

      .brand-desc {
        font-size: 13px;
        margin-bottom: 24px;
      }

      .brand-illustration {
        max-width: 260px;
      }

      .login-panel {
        width: 100%;
        min-height: auto;
        padding: 36px 28px 80px;
        box-shadow: none;
      }

      .panel-footer {
        left: 28px;
        right: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <!-- 左侧品牌区 -->
    <div class="login-brand">
      <div class="brand-content">
        <h1 class="brand-title">打造「学·思·践·悟」智慧型党员</h1>
        <p class="brand-desc">登录后，高效开展党员教育管理，推动党建工作数字化、智能化</p>
        <div class="brand-illustration">
          <!-- 党建主题扁平插画 -->
          <svg viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- 背景装饰圆 -->
            <circle cx="60" cy="80" r="36" fill="#2d3748" opacity="0.5"/>
            <circle cx="460" cy="60" r="28" fill="#2d3748" opacity="0.4"/>
            <circle cx="480" cy="250" r="48" fill="#2d3748" opacity="0.35"/>
            <circle cx="40" cy="260" r="22" fill="#2d3748" opacity="0.4"/>

            <!-- 中央看板底座阴影 -->
            <ellipse cx="260" cy="278" rx="140" ry="12" fill="#000" opacity="0.2"/>

            <!-- 中央看板 -->
            <rect x="145" y="70" width="230" height="160" rx="10" fill="#fff"/>
            <rect x="145" y="70" width="230" height="36" rx="10" fill="#d32f2f"/>
            <rect x="145" y="90" width="230" height="16" fill="#d32f2f"/>
            <text x="260" y="94" text-anchor="middle" fill="#fff" font-size="13" font-family="Microsoft YaHei, sans-serif" font-weight="600">党建数据看板</text>

            <!-- 看板内容 - 柱状图 -->
            <rect x="170" y="150" width="22" height="55" rx="3" fill="#ef5350"/>
            <rect x="205" y="130" width="22" height="75" rx="3" fill="#d32f2f"/>
            <rect x="240" y="140" width="22" height="65" rx="3" fill="#ff8a65"/>
            <rect x="275" y="118" width="22" height="87" rx="3" fill="#e53935"/>
            <rect x="310" y="135" width="22" height="70" rx="3" fill="#ff7043"/>

            <!-- 折线 -->
            <polyline points="181,165 216,145 251,155 286,128 321,148" fill="none" stroke="#ffc107" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="181" cy="165" r="3.5" fill="#ffc107"/>
            <circle cx="216" cy="145" r="3.5" fill="#ffc107"/>
            <circle cx="251" cy="155" r="3.5" fill="#ffc107"/>
            <circle cx="286" cy="128" r="3.5" fill="#ffc107"/>
            <circle cx="321" cy="148" r="3.5" fill="#ffc107"/>

            <!-- 左侧人物：党员学习 -->
            <g transform="translate(55, 155)">
              <!-- 身体 -->
              <ellipse cx="40" cy="110" rx="32" ry="12" fill="#000" opacity="0.15"/>
              <path d="M18 55 Q18 40 40 40 Q62 40 62 55 L65 100 Q40 108 15 100 Z" fill="#1565c0"/>
              <!-- 头 -->
              <circle cx="40" cy="28" r="18" fill="#ffcc80"/>
              <!-- 党徽帽/头发 -->
              <path d="M22 24 Q40 8 58 24 Q58 18 40 14 Q22 18 22 24 Z" fill="#37474f"/>
              <!-- 手臂 -->
              <path d="M18 58 Q5 70 12 85" fill="none" stroke="#1565c0" stroke-width="10" stroke-linecap="round"/>
              <path d="M62 58 Q85 65 90 55" fill="none" stroke="#1565c0" stroke-width="10" stroke-linecap="round"/>
              <!-- 手持书本 -->
              <rect x="82" y="42" width="28" height="22" rx="2" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
              <line x1="96" y1="44" x2="96" y2="62" stroke="#d32f2f" stroke-width="1.5"/>
            </g>

            <!-- 右侧人物 -->
            <g transform="translate(365, 160)">
              <ellipse cx="40" cy="105" rx="30" ry="11" fill="#000" opacity="0.15"/>
              <path d="M16 52 Q16 38 40 38 Q64 38 64 52 L66 95 Q40 103 14 95 Z" fill="#c62828"/>
              <circle cx="40" cy="26" r="17" fill="#ffcc80"/>
              <path d="M23 22 Q40 6 57 22 Q57 16 40 12 Q23 16 23 22 Z" fill="#5d4037"/>
              <path d="M16 55 Q0 68 8 82" fill="none" stroke="#c62828" stroke-width="9" stroke-linecap="round"/>
              <path d="M64 55 Q80 62 78 78" fill="none" stroke="#c62828" stroke-width="9" stroke-linecap="round"/>
            </g>

            <!-- 浮动图标：党徽风格盾牌 -->
            <g transform="translate(95, 55)">
              <circle cx="28" cy="28" r="26" fill="#fff" opacity="0.95"/>
              <path d="M28 10 L42 16 L42 30 Q42 40 28 46 Q14 40 14 30 L14 16 Z" fill="#d32f2f"/>
              <path d="M28 20 L30.5 26.5 L37.5 26.5 L32 30.5 L34 37 L28 33.5 L22 37 L24 30.5 L18.5 26.5 L25.5 26.5 Z" fill="#ffc107"/>
            </g>

            <!-- 浮动图标：学习证书 -->
            <g transform="translate(390, 90)">
              <rect x="0" y="0" width="44" height="36" rx="4" fill="#fff" opacity="0.95"/>
              <rect x="6" y="8" width="20" height="3" rx="1" fill="#d32f2f"/>
              <rect x="6" y="15" width="28" height="2.5" rx="1" fill="#e0e0e0"/>
              <rect x="6" y="21" width="24" height="2.5" rx="1" fill="#e0e0e0"/>
              <circle cx="34" cy="26" r="8" fill="#ffc107"/>
              <path d="M31 26 L33 28 L38 23" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- 浮动图标：组织 -->
            <g transform="translate(420, 175)">
              <circle cx="22" cy="22" r="22" fill="#fff" opacity="0.95"/>
              <circle cx="22" cy="14" r="6" fill="#d32f2f"/>
              <circle cx="10" cy="30" r="5" fill="#ef5350"/>
              <circle cx="34" cy="30" r="5" fill="#ef5350"/>
              <line x1="22" y1="20" x2="10" y2="26" stroke="#d32f2f" stroke-width="1.5"/>
              <line x1="22" y1="20" x2="34" y2="26" stroke="#d32f2f" stroke-width="1.5"/>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- 右侧登录区 -->
    <div class="login-panel">
      <div class="login-panel-inner">
        <h2 class="welcome-title">欢迎登录</h2>

        <div class="login-tabs">
          <button type="button" class="login-tab active" data-tab="account" onclick="switchTab(this)">账户登录</button>
          <button type="button" class="login-tab" data-tab="member" onclick="switchTab(this)">党员登录</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username"><span class="required">*</span> 账户</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="请输入账户"
                required
                autocomplete="username"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="password"><span class="required">*</span> 密码</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="请输入密码"
                required
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="显示/隐藏密码">
                <i class="fa fa-eye-slash" id="passwordIcon"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="captcha"><span class="required">*</span> 验证码</label>
            <div class="captcha-row">
              <div class="input-wrapper">
                <input
                  type="text"
                  id="captcha"
                  name="captcha"
                  placeholder="请输入验证码"
                  required
                  maxlength="4"
                  style="padding-right: 12px;"
                >
              </div>
              <div class="captcha-img" id="captchaImg" onclick="refreshCaptcha()" title="点击刷新"></div>
            </div>
          </div>

          <div class="remember-row">
            <label class="remember-me">
              <input type="checkbox" id="remember" name="remember">
              <span>记住我</span>
            </label>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">管理员登录</button>
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">忘记密码?</a>
        </form>
      </div>
    </div>
  </div>

  <script>
    var currentTab = 'account';
    var currentCaptcha = '';

    function generateCaptcha() {
      var chars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      var captcha = '';
      for (var i = 0; i < 4; i++) {
        captcha += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return captcha;
    }

    function refreshCaptcha() {
      currentCaptcha = generateCaptcha();
      document.getElementById('captchaImg').textContent = currentCaptcha;
    }

    function switchTab(el) {
      var tabs = document.querySelectorAll('.login-tab');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
      }
      el.classList.add('active');
      currentTab = el.getAttribute('data-tab');
      var btn = document.getElementById('loginBtn');
      btn.textContent = currentTab === 'member' ? '党员登录' : '管理员登录';
      document.getElementById('errorMessage').classList.remove('show');
    }

    function togglePassword() {
      var input = document.getElementById('password');
      var icon = document.getElementById('passwordIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa fa-eye';
      } else {
        input.type = 'password';
        icon.className = 'fa fa-eye-slash';
      }
    }

    function showError(message) {
      var errorMessage = document.getElementById('errorMessage');
      errorMessage.innerHTML = '<i class="fa fa-exclamation-circle"></i> ' + message;
      errorMessage.classList.add('show');
    }

    function handleLogin(event) {
      event.preventDefault();

      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var captcha = document.getElementById('captcha').value.toUpperCase();
      var remember = document.getElementById('remember').checked;
      var errorMessage = document.getElementById('errorMessage');

      errorMessage.classList.remove('show');

      if (captcha !== currentCaptcha) {
        showError('验证码错误，请重新输入');
        refreshCaptcha();
        document.getElementById('captcha').value = '';
        return;
      }

      if (!username || !password) {
        showError('请输入账户和密码');
        return;
      }

      if (remember) {
        localStorage.setItem('rememberedUsername', username);
      } else {
        localStorage.removeItem('rememberedUsername');
      }

      if (username === 'admin' && password === '123456') {
        alert('登录成功，正在跳转...');
        setTimeout(function () {
          window.location.href = 'index.html';
        }, 600);
      } else {
        showError('账户或密码错误，请重新输入');
        refreshCaptcha();
        document.getElementById('password').value = '';
        document.getElementById('captcha').value = '';
      }
    }

    function handleForgotPassword(event) {
      event.preventDefault();
      alert('请联系系统管理员重置密码\n\n联系电话：0356-2051000\n邮箱：djadmin@jc.gov.cn');
    }

    function handleHelp(event) {
      event.preventDefault();
      alert('智慧党建综合智能管理平台使用帮助\n\n1. 默认管理员账号：admin\n2. 默认密码：123456\n3. 如遇问题，请联系系统管理员');
    }

    refreshCaptcha();

    window.addEventListener('DOMContentLoaded', function () {
      var rememberedUsername = localStorage.getItem('rememberedUsername');
      if (rememberedUsername) {
        document.getElementById('username').value = rememberedUsername;
        document.getElementById('remember').checked = true;
      }
    });
  </script>
</body>
</html>
