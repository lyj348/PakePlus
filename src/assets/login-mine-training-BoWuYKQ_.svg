<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <!-- soft decorative blobs -->
  <ellipse cx="120" cy="360" rx="90" ry="40" fill="#409EFF" opacity="0.12"/>
  <ellipse cx="520" cy="100" rx="70" ry="50" fill="#FBBF24" opacity="0.16"/>
  <path d="M40 180c30-60 90-70 120-30 20 28 10 70-20 90-40 28-90 10-100-30z" fill="#409EFF" opacity="0.18"/>
  <path d="M520 300c40-40 100-20 110 30 8 40-30 70-70 60-48-12-70-60-40-90z" fill="#79BBFF" opacity="0.2"/>

  <!-- distant mountains / mine silhouette -->
  <path d="M80 300 L180 180 L250 250 L320 160 L420 260 L500 200 L580 300 Z" fill="#374151" opacity="0.45"/>
  <path d="M80 300 L180 200 L240 255 L310 185 L400 255 L480 210 L580 300 Z" fill="#4B5563" opacity="0.35"/>

  <!-- ground -->
  <ellipse cx="320" cy="390" rx="210" ry="28" fill="#111827" opacity="0.35"/>

  <!-- tablet / training screen -->
  <rect x="250" y="150" width="200" height="150" rx="14" fill="#FFFFFF"/>
  <rect x="262" y="162" width="176" height="110" rx="8" fill="#EFF6FF"/>
  <!-- chart bars on tablet -->
  <rect x="280" y="220" width="18" height="40" rx="3" fill="#409EFF"/>
  <rect x="308" y="200" width="18" height="60" rx="3" fill="#79BBFF"/>
  <rect x="336" y="210" width="18" height="50" rx="3" fill="#FBBF24"/>
  <rect x="364" y="190" width="18" height="70" rx="3" fill="#409EFF"/>
  <rect x="392" y="230" width="18" height="30" rx="3" fill="#F97316"/>
  <!-- tablet top bar -->
  <rect x="278" y="172" width="80" height="10" rx="5" fill="#BFDBFE"/>
  <circle cx="420" cy="177" r="8" fill="#FBBF24"/>
  <!-- tablet bottom bezel -->
  <rect x="330" y="282" width="40" height="6" rx="3" fill="#D1D5DB"/>

  <!-- left miner character -->
  <!-- body -->
  <rect x="150" y="250" width="70" height="78" rx="18" fill="#409EFF"/>
  <!-- arm holding tablet side -->
  <rect x="210" y="270" width="46" height="16" rx="8" fill="#2563EB"/>
  <!-- head -->
  <circle cx="185" cy="230" r="22" fill="#FDE68A"/>
  <!-- helmet -->
  <path d="M160 225c0-22 12-36 25-36s25 14 25 36H160z" fill="#FBBF24"/>
  <rect x="158" y="222" width="54" height="8" rx="3" fill="#F59E0B"/>
  <rect x="182" y="186" width="8" height="12" rx="2" fill="#F97316"/>
  <!-- legs -->
  <rect x="162" y="320" width="20" height="40" rx="8" fill="#1E3A8A"/>
  <rect x="188" y="320" width="20" height="40" rx="8" fill="#1E3A8A"/>
  <!-- boots -->
  <rect x="158" y="352" width="28" height="12" rx="4" fill="#111827"/>
  <rect x="184" y="352" width="28" height="12" rx="4" fill="#111827"/>

  <!-- right trainer / student with book -->
  <rect x="430" y="255" width="66" height="74" rx="16" fill="#60A5FA"/>
  <circle cx="463" cy="236" r="20" fill="#FDE68A"/>
  <path d="M440 230c0-20 10-32 23-32s23 12 23 32H440z" fill="#FBBF24"/>
  <rect x="438" y="228" width="50" height="7" rx="3" fill="#F59E0B"/>
  <!-- book -->
  <rect x="400" y="285" width="42" height="32" rx="4" fill="#FFFFFF"/>
  <rect x="400" y="285" width="42" height="32" rx="4" stroke="#409EFF" stroke-width="3"/>
  <line x1="421" y1="285" x2="421" y2="317" stroke="#93C5FD" stroke-width="2"/>
  <rect x="442" y="320" width="18" height="38" rx="7" fill="#1E40AF"/>
  <rect x="466" y="320" width="18" height="38" rx="7" fill="#1E40AF"/>
  <rect x="438" y="350" width="26" height="11" rx="4" fill="#111827"/>
  <rect x="462" y="350" width="26" height="11" rx="4" fill="#111827"/>

  <!-- floating safety / training icons -->
  <!-- shield check -->
  <g transform="translate(470 140)">
    <path d="M28 4 L52 14 V34 C52 48 40 58 28 62 C16 58 4 48 4 34 V14 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M18 32 L26 40 L42 22" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- certificate -->
  <g transform="translate(100 140)">
    <rect x="0" y="8" width="64" height="44" rx="8" fill="#FFFFFF"/>
    <rect x="10" y="18" width="36" height="6" rx="3" fill="#BFDBFE"/>
    <rect x="10" y="30" width="28" height="5" rx="2.5" fill="#DBEAFE"/>
    <circle cx="52" cy="44" r="12" fill="#FBBF24"/>
    <circle cx="52" cy="44" r="6" fill="#F97316"/>
  </g>
  <!-- hard hat icon small -->
  <g transform="translate(360 95)">
    <path d="M8 28c0-18 10-28 24-28s24 10 24 28H8z" fill="#FBBF24"/>
    <rect x="4" y="26" width="56" height="8" rx="3" fill="#F59E0B"/>
  </g>
</svg>
